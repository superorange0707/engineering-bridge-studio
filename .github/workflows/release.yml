name: Release

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require tag and package version to match
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag does not match package version");'
      - run: npm ci
      - run: npm test
      - name: Build verified plugin distribution
        run: node bin/build-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-bridge-studio
          path: |
            var/release/engineering-bridge-studio-*.tar.gz
            var/release/SHA256SUMS
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engineering-bridge-studio
          path: release-artifacts
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-artifacts/engineering-bridge-studio-*.tar.gz
          release-artifacts/SHA256SUMS
          --verify-tag --prerelease
          --title "Engineering Bridge Studio $RELEASE_TAG"
          --notes "macOS beta: shared Bridge runtime, research contracts and evidence, unified project setup, and a pinned codex-chatgpt-web companion. See the installation guide and upstream provenance in the repository. Web sign-in and a real account round trip remain part of installation."
